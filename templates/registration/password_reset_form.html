{% extends "base.html" %}
{% block title %}
    Wachtwoord vergeten | MHAV
{% endblock %}
{% block content %}
    <section class="page-intro">
        <div class="container">
            <h1>
                Wachtwoord vergeten
            </h1>
            <p>
                Vul je e-mailadres in om een herstellink aan te vragen.
            </p>
        </div>
    </section>
    <section class="section">
        <div class="container">
            <form class="content-form" method="post">
                {% csrf_token %}
                {{ form.as_p }}<button class="button button-primary" type="submit">Verzenden</button>
            </form>
        </div>
    </section>
{% endblock %}
