{% extends "base.html" %}{% block title %}Inloggen | MHAV{% endblock %}{% block content %}<section class="page-intro"><div class="container"><h1>Inloggen</h1><p>Voor leden en vrijwilligers met een account.</p></div></section><section class="section"><div class="container"><form class="content-form" method="post">{% csrf_token %}{% if form.errors %}<p class="form-error">Gebruikersnaam of wachtwoord onjuist.</p>{% endif %}<div class="form-field"><label for="id_username">Gebruikersnaam</label>{{ form.username }}</div><div class="form-field"><label for="id_password">Wachtwoord</label>{{ form.password }}</div><input type="hidden" name="next" value="{{ next }}"><button class="button button-primary" type="submit">Inloggen</button></form></div></section>{% endblock %}
